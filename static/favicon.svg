<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f8bff"/>
      <stop offset=".45" stop-color="#6a3df0"/>
      <stop offset="1" stop-color="#241070"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".18" r=".75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7df0ff"/><stop offset="1" stop-color="#0c9be8"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb3dc"/><stop offset="1" stop-color="#ee3d9b"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#f59a0b"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8f76b"/><stop offset="1" stop-color="#24b84f"/></linearGradient>
    <clipPath id="clipbg"><rect x="10" y="8" width="236" height="236" rx="60"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#0b0430" flood-opacity=".55"/>
    </filter>
    <filter id="bgsh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- app tile with depth lip -->
  <rect x="10" y="16" width="236" height="236" rx="60" fill="#150a4a" filter="url(#bgsh)"/>
  <rect x="10" y="8" width="236" height="236" rx="60" fill="url(#bg)"/>
  <g clip-path="url(#clipbg)">
    <rect x="10" y="8" width="236" height="236" fill="url(#glow)"/>
    <ellipse cx="128" cy="-18" rx="190" ry="96" fill="#fff" opacity=".13"/>
  </g>
  <rect x="11.5" y="9.5" width="233" height="233" rx="58.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>

  <!-- four extruded glossy tiles -->
  <g filter="url(#sh)">
    <rect x="42" y="50" width="78" height="78" rx="22" fill="#0a5c9a"/>
    <rect x="42" y="40" width="78" height="78" rx="22" fill="url(#cyan)"/>
    <rect x="46" y="43" width="70" height="36" rx="18" fill="url(#gloss)"/>
    <path d="M71 62 L71 96 L98 79 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round" opacity=".96"/>
  </g>
  <g filter="url(#sh)">
    <rect x="136" y="50" width="78" height="78" rx="22" fill="#9c1a62"/>
    <rect x="136" y="40" width="78" height="78" rx="22" fill="url(#pink)"/>
    <rect x="140" y="43" width="70" height="36" rx="18" fill="url(#gloss)"/>
    <g stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".96">
      <line x1="156" y1="66" x2="194" y2="66"/><line x1="156" y1="80" x2="194" y2="80"/><line x1="156" y1="94" x2="180" y2="94"/>
    </g>
  </g>
  <g filter="url(#sh)">
    <rect x="42" y="144" width="78" height="78" rx="22" fill="#a85b05"/>
    <rect x="42" y="134" width="78" height="78" rx="22" fill="url(#amber)"/>
    <rect x="46" y="137" width="70" height="36" rx="18" fill="url(#gloss)"/>
    <circle cx="81" cy="173" r="17" fill="none" stroke="#fff" stroke-width="9" opacity=".96"/>
    <g stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".96">
      <line x1="81" y1="146" x2="81" y2="152"/><line x1="81" y1="194" x2="81" y2="200"/>
      <line x1="54" y1="173" x2="60" y2="173"/><line x1="102" y1="173" x2="108" y2="173"/>
    </g>
  </g>
  <g filter="url(#sh)">
    <rect x="136" y="144" width="78" height="78" rx="22" fill="#127a35"/>
    <rect x="136" y="134" width="78" height="78" rx="22" fill="url(#lime)"/>
    <rect x="140" y="137" width="70" height="36" rx="18" fill="url(#gloss)"/>
    <g stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".96">
      <line x1="175" y1="158" x2="175" y2="188"/><line x1="160" y1="173" x2="190" y2="173"/>
    </g>
  </g>
</svg>
